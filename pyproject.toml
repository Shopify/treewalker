[project]
name = "treewalker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.6.0",
    "polars>=1.0",
    "numpy>=2.0",
    "plotnine>=0.14",
    "h5py>=3.0",
    "requests>=2.28",
    "treelite>=4.7.0",
    "xgboost>=3.2.0",
    "pyarrow>=23.0.1",
]

[project.optional-dependencies]
# Compiled baselines — require platform-specific C++ toolchains.
# Install separately: uv pip install tl2cgen lleaves
baselines = [
    "tl2cgen>=1.0.0",
    "lleaves @ git+https://github.com/siboehm/lleaves.git@v1.4.1",
]

[tool.uv]
# This is a scripts-only project — no package to install.
package = false
