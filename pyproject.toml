[project]
name = "treewalker-exp"
version = "2.0.0"
description = "Data preparation, baselines and benchmark orchestration for the TreeWalker paper."
requires-python = ">=3.14"
dependencies = [
    "lightgbm>=4.7.0",
    "polars>=1.44.2",
    "numpy>=2.5.3",
    "plotnine>=0.15.8",
    "h5py>=3.16.0",
    "requests>=2.34.2",
    # Treelite and XGBoost move together: Treelite 4.7.1 is the first to load
    # models from XGBoost 3.3 and later.
    "treelite>=4.7.2",
    # Linux uses the CPU-only wheel (5.8 MB): the xgboost wheel there is a
    # CUDA build of 57.6 MB that pulls in NCCL. xgboost-cpu has no macOS wheel.
    "xgboost>=3.4.1; sys_platform != 'linux'",
    "xgboost-cpu>=3.4.1; sys_platform == 'linux'",
    "pyarrow>=25.0.1",
    "typer>=0.27.2",
    "pooch>=1.9.0",
]

[project.scripts]
treewalker-exp = "treewalker_exp.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]
# Compiled baselines. tl2cgen has no aarch64 Linux wheel, so there it builds
# from source: CXX=infra/scripts/cxx-cstdint uv sync --group baselines.
# lleaves is not here: it lives in the script lock of experiments/compile.py.
baselines = [
    "tl2cgen>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.13"]
build-backend = "uv_build"

[tool.uv]
# A repository tool, installed into the project environment, never published.
package = true

# The locks resolve against PyPI. A project index takes priority over any
# index in the user's uv configuration, so `uv sync --locked` and `uv lock`
# leave uv.lock unchanged wherever they run.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.build-backend]
module-name = "treewalker_exp"
module-root = "experiments"

[tool.pytest.ini_options]
testpaths = ["experiments/tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["experiments"]
include = ["experiments/treewalker_exp/**/*.py", "experiments/tests/**/*.py", "experiments/compile.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
files = ["experiments/treewalker_exp"]
ignore_missing_imports = true
check_untyped_defs = true
