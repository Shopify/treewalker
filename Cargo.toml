[workspace]
members = ["benchmarks"]

[package]
name = "treewalker-gbdt"
version = "1.0.0"
edition = "2024"
description = "Grouped tree-ensemble inference via recursive partial evaluation"
license = "MIT"
repository = "https://github.com/Shopify/treewalker"
include = ["src/**", "tests/**", "docs/treelite-loading.md", "docs/treelite-loading-validation.md", "Cargo.toml", "README.md", "LICENSE"]

[features]
test-helpers = []  # expose internal precompute functions for artifact integration tests

[dependencies]
serde = { version = "1", features = ["derive"] }
simd-json = { version = "0.14", features = ["serde_impl"] }
rustc-hash = "2.1.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "allow"              # required for prefetch intrinsics + unchecked hot path

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Intentional relaxations
cast_possible_truncation = "allow"  # u64 → u32, usize → u16 are checked at parse time
cast_precision_loss = "allow"       # f64 ↔ u32/usize for bitset offsets (by design)
cast_sign_loss = "allow"            # i16 → usize for skip indices (always positive)
cast_possible_wrap = "allow"        # usize → i16 checked by assertions
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cognitive_complexity = "allow"      # partial_eval is inherently complex
too_many_lines = "allow"            # parser and predict are long but cohesive
similar_names = "allow"             # left/right, start/end are natural
missing_panics_doc = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"    # AblationMode/ParseConfig are flag structs by design
doc_markdown = "allow"              # LightGBM, XGBoost, etc. don't need backticks everywhere
if_not_else = "allow"               # sometimes clearer to check the negative case first

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true           # required for line numbers and source view
debug-assertions = false  # keep off for realistic performance
overflow-checks = false

# Canonical library test command: cargo test --release
