# The fast development checks on every pull request and push to main, and the
# library's release tests in a generic x86-64 build at each instruction-set level it
# dispatches to. The README's full checks (cross clippy, Miri, the spill checks, the
# artifacts) stay local.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: PYTHON=.venv/bin/python experiments/scripts/checks.sh fast
      - if: failure()
        run: tail -n 100 target/checks/logs/*.log

  generic-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Overrides .cargo/config.toml's target-cpu=native: the build dispatches.
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: grep -m1 'model name' /proc/cpuinfo
      - name: clippy for production layout files
        run: cargo clippy -p treewalker-gbdt --lib --features layout-file -- -D warnings
      - name: tests at the CPU's level
        run: cargo test --release --features research
      - name: tests with layout files
        run: cargo test --release --features research,layout-file
      - name: tests at x86-64-v3
        run: TREEWALKER_ISA=v3 cargo test --release --features research
      - name: tests at the base level
        run: TREEWALKER_ISA=base cargo test --release --features research
