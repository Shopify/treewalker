# Prepares a release of treewalker-gbdt from a `v*` tag: checks what the tag claims,
# runs the release tests, packages the crate and creates the GitHub release with the
# crate attached. Publishing to crates.io stays a maintainer's `cargo publish` from the
# tag once this run is green, with the credentials on their machine: no registry token
# is held by the repository or by CI.
#
# A release is: bump `Cargo.toml` and add the CHANGELOG section on a pull request;
# merge; `git tag -s vX.Y.Z && git push origin vX.Y.Z`; when this run is green,
# `git checkout vX.Y.Z && cargo publish --locked -p treewalker-gbdt`.
#
# Trusted Publishing would let the run publish with no token at all, but crates.io
# verifies the repository owner through the crate owner's GitHub token, which the
# Shopify organization's policy refuses; revisit when the organization enables it.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything the tag claims is checked before the release exists.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the ancestry check below walks the history
      - name: the tag is on main, and its version is Cargo.toml's and the changelog's
        id: version
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $REF is not on main"; exit 1; }
          tag="${REF#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "treewalker-gbdt") | .version')
          [ "$tag" = "$manifest" ] \
            || { echo "::error::tag $REF but Cargo.toml says $manifest"; exit 1; }
          grep -q "^## $tag\$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $tag' section"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: the version is not on crates.io yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if curl -fsSL -A "treewalker release (github actions)" \
               "https://crates.io/api/v1/crates/treewalker-gbdt/$VERSION" >/dev/null 2>&1; then
            echo "::error::treewalker-gbdt $VERSION is already on crates.io"; exit 1
          fi
      - name: the release tests, in the generic x86-64 build at every level
        env:
          # Overrides .cargo/config.toml's target-cpu=native: the build dispatches.
          RUSTFLAGS: -C target-cpu=x86-64
        run: |
          cargo test --locked --release --features research
          TREEWALKER_ISA=v3 cargo test --locked --release --features research
          TREEWALKER_ISA=base cargo test --locked --release --features research
      - name: the crate, built from what it ships
        run: cargo package --locked -p treewalker-gbdt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: target/package/treewalker-gbdt-${{ steps.version.outputs.version }}.crate
          if-no-files-found: error
          retention-days: 30

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
      - name: GitHub release from the changelog section, with the crate file
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$REF" --verify-tag --title "treewalker-gbdt $VERSION" \
            --notes-file notes.md treewalker-gbdt-*.crate
