[package]
name = "treewalker-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "TreeWalker benchmark harness and artifact correctness tests"
license.workspace = true
publish = false

[features]
test-helpers = ["treewalker-gbdt/test-helpers"]
quickscorer-bench = ["dep:quickscorer"]  # QuickScorer baseline in the legacy CLI
external-bench = ["dep:libloading", "dep:quickscorer"]  # C FFI baselines + QuickScorer

[dependencies]
treewalker-gbdt = { path = ".." }
serde.workspace = true
simd-json.workspace = true
quickscorer = { version = "=0.1.0", git = "https://github.com/leomanne/quickscorer-rs.git", rev = "8314d03b5ef2d15385f8d0cd86d8f281d11b2d49", optional = true }
libloading = { version = "0.9", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[dev-dependencies]
ndarray = "0.17"
ndarray-npy = "0.10"

[lints]
workspace = true

# Build profiles (release, profiling) come from the workspace root Cargo.toml.

[[bin]]
name = "sweep_bench"
path = "src/bin/sweep_bench.rs"

[[test]]
name = "correctness"
path = "tests/correctness.rs"
required-features = ["test-helpers"]

# Artifact tests: cargo test --manifest-path benchmarks/Cargo.toml --release --features test-helpers
